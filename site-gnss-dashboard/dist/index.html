<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0d1014"><meta name="description" content="Интерактивный прототип GNSS Performance Meter: замеры, поездки, история и управление автономным прибором."><title>GNSS Performance Meter</title><link rel="stylesheet" href="app.css"></head><body><div class="app"><header class="header"><div class="brand">GNSS / PERFORMANCE</div><span class="badge">СИМУЛЯЦИЯ</span></header><div id="storage-error" class="storage-error" role="status"></div><div class="layout"><div class="screen"><div id="connection-banner"></div><main id="page"></main><nav class="nav" aria-label="Главная навигация"><button data-nav="live" aria-current="page">Прибор</button><button data-nav="history">История</button><button data-nav="device">Устройство</button></nav></div><aside class="demo panel"><details><summary>Демонстрация</summary><div class="stack"><p class="hint">Виртуальный прибор продолжает замер при потере связи с телефоном.</p><button data-demo="drive">Проехать выбранный замер</button><label>Скорость вручную <output id="manual-speed">0 км/ч</output><input aria-label="Скорость вручную" id="drive-speed" type="range" min="0" max="250" value="0"></label><button data-demo="gnss">Ухудшить GNSS</button><button data-demo="link">Потерять связь</button><button data-demo="gap">Разрыв телеметрии</button><button data-demo="fail">Ошибка следующей команды</button><button data-demo="cal-fail">Ошибка следующей калибровки</button><p class="hint">Частоты и алгоритмы демонстрационные. Записи сохраняются в этом браузере.</p></div></details></aside></div></div><dialog id="sheet"></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div><script type="module" src="app.mjs"></script></body></html>
