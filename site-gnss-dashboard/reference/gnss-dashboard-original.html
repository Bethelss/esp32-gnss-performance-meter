  #gnss-dashboard-lab[data-palette=&quot;red&quot;] { --gnss-accent: #ff5d48; --gnss-secondary: #f5c84b; }
  @media (max-width: 760px) {

          &lt;button class=&quot;gnss-scenario&quot; type=&quot;button&quot; data-scenario=&quot;stream-gap&quot; aria-pressed=&quot;false&quot;&gt;Разрыв потока&lt;/button&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById('gnss-dashboard-lab');
  const phone = root.querySelector('.gnss-phone');
  const canvas = root.querySelector('.gnss-g-canvas');
  const ctx = canvas.getContext('2d');
  const panel = root.querySelector('.gnss-g-panel');
  const speedText = root.querySelector('.gnss-speed-value');
  const satText = root.querySelector('.gnss-status.sv');
  const gnssText = root.querySelector('.gnss-status-gnss');
  const streamText = root.querySelector('.gnss-status.stream');
  const totalText = root.querySelector('.gnss-g-total');
  const lateralText = root.querySelector('.gnss-g-lateral');
  const longitudinalText = root.querySelector('.gnss-g-longitudinal');
  const gapOverlay = root.querySelector('.gnss-gap-overlay');
  const recordButton = root.querySelector('.gnss-record');
  const liveStatus = root.querySelector('[data-live-status]');
  const sliders = Object.fromEntries([...root.querySelectorAll('[data-slider]')].map(el =&gt; [el.dataset.slider, el]));
  const values = Object.fromEntries([...root.querySelectorAll('[data-value]')].map(el =&gt; [el.dataset.value, el]));
  const state = { speed: 72.4, satellites: 18, lateral: 0, longitudinal: 0, gnss: 'valid', scenario: 'idle', recording: false, gap: false };
  const trail = [];
  let startTime = performance.now();
  let lastTrailAt = 0;
  let dragging = false;

  const css = name =&gt; getComputedStyle(root).getPropertyValue(name).trim();
  const signed = value =&gt; `${value &gt;= 0 ? '+' : ''}${value.toFixed(2)} g`;
  const scenarioNames = { idle: 'Покой', acceleration: 'Разгон', braking: 'Торможение', corner: 'Поворот', maneuver: 'Манёвр', 'gnss-loss': 'Потеря GNSS', 'stream-gap': 'Разрыв потока' };

  function setGnss(value) {
    state.gnss = value;
    const display = { valid: ['GNSS READY', css('--gnss-positive')], stale: ['GNSS STALE', '#ffb45f'], invalid: ['GNSS INVALID', css('--gnss-danger')], unavailable: ['GNSS N/A', css('--gnss-muted')] }[value];
    gnssText.textContent = display[0];
    gnssText.style.color = display[1];
  }

  function syncControls() {
    sliders.speed.value = state.speed;
    sliders.satellites.value = state.satellites;
    sliders.lateral.value = state.lateral;
    sliders.longitudinal.value = state.longitudinal;
    values.speed.textContent = `${state.speed.toFixed(1)} km/h`;
    values.satellites.textContent = String(Math.round(state.satellites));
    values.lateral.textContent = signed(state.lateral);
    values.longitudinal.textContent = signed(state.longitudinal);
  }

  function renderText() {
    speedText.textContent = state.speed.toFixed(1);
    satText.textContent = state.gnss === 'unavailable' ? 'SV —' : `SV ${Math.round(state.satellites)}`;
    lateralText.textContent = signed(state.lateral);
    longitudinalText.textContent = signed(state.longitudinal);
    const magnitude = Math.hypot(state.lateral, state.longitudinal);
    totalText.textContent = `${magnitude.toFixed(2)} g`;
    totalText.style.color = magnitude &gt; 1 ? css('--gnss-accent') : css('--gnss-text');
    streamText.textContent = state.gap ? 'РАЗРЫВ' : 'ПОТОК OK';
    streamText.style.color = state.gap ? css('--gnss-danger') : css('--gnss-secondary');
    gapOverlay.style.display = state.gap ? 'block' : 'none';
    syncControls();
  }

  function canvasGeometry() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const width = Math.max(1, Math.round(rect.width * dpr));
    const height = Math.max(1, Math.round(rect.height * dpr));
    if (canvas.width !== width || canvas.height !== height) { canvas.width = width; canvas.height = height; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const radius = Math.min(rect.width * .37, (rect.height - 66) * .46);
    return { width: rect.width, height: rect.height, cx: rect.width / 2, cy: 42 + radius, radius };
  }

  function projectedPoint(g, lateral, longitudinal) {
    const magnitude = Math.hypot(lateral, longitudinal);
    const scale = magnitude &gt; 1 ? 1 / magnitude : 1;
    return { x: g.cx - lateral * scale * g.radius, y: g.cy + longitudinal * scale * g.radius, outside: magnitude &gt; 1 };
  }

  function draw() {
    const g = canvasGeometry();
    ctx.clearRect(0, 0, g.width, g.height);
    const grid = css('--gnss-muted');
    ctx.lineCap = 'round';
    ctx.strokeStyle = grid;
    ctx.globalAlpha = .62;
    ctx.lineWidth = 1.7;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, g.radius, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = .25;
    ctx.setLineDash([5, 6]);
    ctx.beginPath(); ctx.arc(g.cx, g.cy, g.radius * .5, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = .32;
    ctx.beginPath(); ctx.moveTo(g.cx - g.radius, g.cy); ctx.lineTo(g.cx + g.radius, g.cy); ctx.moveTo(g.cx, g.cy - g.radius); ctx.lineTo(g.cx, g.cy + g.radius); ctx.stroke();
    ctx.globalAlpha = .66;
    [-.5, .5].forEach(f =&gt; {
      ctx.beginPath(); ctx.moveTo(g.cx + g.radius * f, g.cy - 4); ctx.lineTo(g.cx + g.radius * f, g.cy + 4); ctx.moveTo(g.cx - 4, g.cy + g.radius * f); ctx.lineTo(g.cx + 4, g.cy + g.radius * f); ctx.stroke();
    });
    if (trail.length &gt; 1) {
      ctx.strokeStyle = css('--gnss-accent');
      ctx.lineWidth = 2.4;
      for (let i = 1; i &lt; trail.length; i++) {
        const a = projectedPoint(g, trail[i - 1].lateral, trail[i - 1].longitudinal);
        const b = projectedPoint(g, trail[i].lateral, trail[i].longitudinal);
        ctx.globalAlpha = .08 + .65 * i / trail.length;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
    const p = projectedPoint(g, state.lateral, state.longitudinal);
    ctx.globalAlpha = .8;
    ctx.strokeStyle = css('--gnss-secondary');
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(g.cx, g.cy); ctx.lineTo(g.cx, p.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    const pointColor = p.outside ? css('--gnss-danger') : css('--gnss-positive');
    ctx.globalAlpha = .14; ctx.fillStyle = pointColor; ctx.beginPath(); ctx.arc(p.x, p.y, 18, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = .30; ctx.beginPath(); ctx.arc(p.x, p.y, 12, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2); ctx.fill();
    if (p.outside) { ctx.strokeStyle = css('--gnss-accent'); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, 14, 0, Math.PI * 2); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }

  function setManual(name, value) {
    state.scenario = 'manual';
    state[name] = value;
    state.gap = false;
    root.querySelectorAll('.gnss-scenario').forEach(button =&gt; button.setAttribute('aria-pressed', 'false'));
    liveStatus.textContent = 'Ручное управление';
    renderText(); draw();
  }

  Object.entries(sliders).forEach(([name, input]) =&gt; input.addEventListener('input', () =&gt; setManual(name, Number(input.value))));
  root.querySelectorAll('[data-control]').forEach(select =&gt; select.addEventListener('change', () =&gt; {
    const key = select.dataset.control;
    if (key === 'size') phone.dataset.size = select.value;
    else if (key === 'gnss') setGnss(select.value);
    else root.dataset[key] = select.value;
    renderText(); draw();
  }));

  root.querySelectorAll('.gnss-scenario').forEach(button =&gt; button.addEventListener('click', () =&gt; {
    state.scenario = button.dataset.scenario;
    state.gap = false;
    startTime = performance.now();
    trail.length = 0;
    root.querySelectorAll('.gnss-scenario').forEach(candidate =&gt; candidate.setAttribute('aria-pressed', String(candidate === button)));
    liveStatus.textContent = `Сценарий: ${scenarioNames[state.scenario]}`;
  }));

  recordButton.addEventListener('click', () =&gt; {
    state.recording = !state.recording;
    recordButton.dataset.recording = String(state.recording);
    recordButton.textContent = state.recording ? 'ОСТАНОВИТЬ ЗАПИСЬ' : 'НАЧАТЬ ЗАПИСЬ';
    liveStatus.textContent = state.recording ? 'Запись начата' : 'Запись остановлена';
  });

  function updateFromPointer(event) {
    const rect = canvas.getBoundingClientRect();
    const g = canvasGeometry();
    const px = event.clientX - rect.left;
    const py = event.clientY - rect.top;
    setManual('lateral', Math.max(-1.5, Math.min(1.5, -(px - g.cx) / g.radius)));
    state.longitudinal = Math.max(-1.5, Math.min(1.5, (py - g.cy) / g.radius));
    renderText(); draw();
  }
  canvas.addEventListener('pointerdown', event =&gt; { dragging = true; canvas.setPointerCapture(event.pointerId); updateFromPointer(event); });
  canvas.addEventListener('pointermove', event =&gt; { if (dragging) updateFromPointer(event); });
  canvas.addEventListener('pointerup', () =&gt; { dragging = false; });
  canvas.addEventListener('pointercancel', () =&gt; { dragging = false; });

  function animate(now) {
    const t = (now - startTime) / 1000;
    if (state.scenario !== 'manual') {
      state.gap = false;

(() =&gt; {

      tab.closest('[role=&quot;tablist&quot;]').querySelectorAll('[role=&quot;tab&quot;]'),
    ).filter((candidate) =&gt; !candidate.matches(disabled));

<script>(() => {

        typeof height === "number" &&
        Number.isFinite(height) &&

        frame.style.height = Math.ceil(height) + "px";

        typeof top === "number" &&
